# Mosquitto 2.x configuration — local IoT MQTT broker.
# Reference: https://mosquitto.org/man/mosquitto-conf-5.html

# Single listener, published on the LAN (port 1883) so the laptop (Symfony)
# can subscribe. TLS can be added later on a separate listener if required.
listener 1883 0.0.0.0
protocol mqtt

# Security: reject all anonymous connections. Users are defined in the
# password file, per-topic permissions in the ACL file.
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

# Persistence: survive broker restarts (retained messages, subscriptions).
persistence true
persistence_location /mosquitto/data/

# Logging: stdout (captured by Docker, rotated by the json-file driver)
# and a file inside the mosquittolog volume.
log_dest stdout
log_dest file /mosquitto/log/mosquitto.log
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S
