# EU868 region configuration for ChirpStack v4.
# Based on the current official example:
# https://github.com/chirpstack/chirpstack/blob/master/chirpstack/configuration/region_eu868.toml
#
# The gateway backend is MQTT with topic prefix "eu868", matching the
# ChirpStack Gateway Bridge topic templates (eu868/gateway/...).
[[regions]]

  # User-defined identifier (must match enabled_regions in chirpstack.toml).
  id = "eu868"
  description = "EU868"
  common_name = "EU868"

  # Gateway configuration.
  [regions.gateway]

    force_gws_private = false

    # Gateway backend configuration.
    [regions.gateway.backend]

      # ChirpStack v4 communicates with gateways over MQTT. The Semtech UDP
      # protocol used by the Dragino LPS8N is terminated by the
      # chirpstack-gateway-bridge container (UDP 1700 <-> MQTT).
      enabled = "mqtt"

      [regions.gateway.backend.mqtt]

        # Topic prefix defines the region of the gateway. Must match the
        # gateway-bridge topic templates (eu868/gateway/...).
        topic_prefix = "eu868"

        # Shared subscription name (MQTT v5 shared subscriptions).
        share_name = "chirpstack"

        server = "tcp://$MQTT_BROKER_HOST:1883"
        username = "$MQTT_USERNAME"
        password = "$MQTT_PASSWORD"
        qos = 0
        clean_session = false

        keep_alive_interval = "30s"

        ca_cert = ""
        tls_cert = ""
        tls_key = ""

    # Gateway channel configuration.
    # Note: only used by ChirpStack Concentratord; ignored for the LPS8N.
    [[regions.gateway.channels]]
      frequency = 868100000
      bandwidth = 125000
      modulation = "LORA"
      spreading_factors = [7, 8, 9, 10, 11, 12]

    [[regions.gateway.channels]]
      frequency = 868300000
      bandwidth = 125000
      modulation = "LORA"
      spreading_factors = [7, 8, 9, 10, 11, 12]

    [[regions.gateway.channels]]
      frequency = 868500000
      bandwidth = 125000
      modulation = "LORA"
      spreading_factors = [7, 8, 9, 10, 11, 12]

    [[regions.gateway.channels]]
      frequency = 867100000
      bandwidth = 125000
      modulation = "LORA"
      spreading_factors = [7, 8, 9, 10, 11, 12]

    [[regions.gateway.channels]]
      frequency = 867300000
      bandwidth = 125000
      modulation = "LORA"
      spreading_factors = [7, 8, 9, 10, 11, 12]

    [[regions.gateway.channels]]
      frequency = 867500000
      bandwidth = 125000
      modulation = "LORA"
      spreading_factors = [7, 8, 9, 10, 11, 12]

    [[regions.gateway.channels]]
      frequency = 867700000
      bandwidth = 125000
      modulation = "LORA"
      spreading_factors = [7, 8, 9, 10, 11, 12]

    [[regions.gateway.channels]]
      frequency = 867900000
      bandwidth = 125000
      modulation = "LORA"
      spreading_factors = [7, 8, 9, 10, 11, 12]

    [[regions.gateway.channels]]
      frequency = 868300000
      bandwidth = 250000
      modulation = "LORA"
      spreading_factors = [7]

    [[regions.gateway.channels]]
      frequency = 868800000
      bandwidth = 125000
      modulation = "FSK"
      datarate = 50000

  # Region specific network configuration (EU868 defaults).
  [regions.network]

    installation_margin = 10
    rx_window = 0
    rx1_delay = 1
    rx1_dr_offset = 0
    rx2_dr = 0
    rx2_frequency = 869525000
    rx2_prefer_on_rx1_dr_lt = 0
    rx2_prefer_on_link_budget = false
    downlink_tx_power = -1
    adr_disabled = false
    min_dr = 0
    max_dr = 5

    [regions.network.rejoin_request]
      enabled = false
      max_count_n = 0
      max_time_n = 0

    [regions.network.class_b]
      ping_slot_dr = 3
      ping_slot_frequency = 0

    # EU868 extra channels (must also be supported by the gateway).
    [[regions.network.extra_channels]]
      frequency = 867100000
      min_dr = 0
      max_dr = 5

    [[regions.network.extra_channels]]
      frequency = 867300000
      min_dr = 0
      max_dr = 5

    [[regions.network.extra_channels]]
      frequency = 867500000
      min_dr = 0
      max_dr = 5

    [[regions.network.extra_channels]]
      frequency = 867700000
      min_dr = 0
      max_dr = 5

    [[regions.network.extra_channels]]
      frequency = 867900000
      min_dr = 0
      max_dr = 5
